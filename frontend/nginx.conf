limit_req_zone $binary_remote_addr zone=auth:10m rate=6r/s;
map $http_x_forwarded_proto $upstream_scheme {
    default $scheme;
    "https" https;
}
server {
    listen 8080;
    server_name _;
    client_max_body_size 42m;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location /api/auth/ {
        limit_req zone=auth burst=15 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_read_timeout 120s;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; }
}
